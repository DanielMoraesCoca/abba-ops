# A CI do abba-crews — **na raiz do repositorio, que e o unico lugar onde o GitHub le**.
#
# Ate 2026-09-02 este arquivo vivia em `09-crews/.github/workflows/ci.yml` e **nunca
# rodou**: o GitHub Actions so executa workflows em `.github/workflows/` na raiz do
# repositorio. Enquanto isso, seis lugares do projeto afirmavam no presente que "a CI
# prova" e "a CI reprova se algum segredo for rastreado" — README, core/clientes.py,
# scripts/audita_fronteira.py, test_registry.py, test_fronteira.py e AGENTS.md.
#
# Era o mesmo defeito do CREWAI_TELEMETRY_OPT_OUT: um controle de seguranca documentado
# como ativo e inerte. A varredura de segredo, em particular, nunca tinha rodado uma vez.
#
# O projeto continua em staging dentro de `09-crews/` (o app do GitHub desta sessao nao
# pode criar repositorios). Por isso o workflow mora aqui e trabalha la, via
# `working-directory`. Ao extrair para o repo `abba-crews` proprio (ver
# `09-crews/STAGING.md`), este arquivo vira o `.github/workflows/ci.yml` de la, sem os
# `working-directory` e sem o filtro de `paths`.

name: abba-crews

on:
  push:
    branches: ["**"]
    paths:
      - "09-crews/**"
      - ".github/workflows/abba-crews.yml"
  pull_request:
    paths:
      - "09-crews/**"
      - ".github/workflows/abba-crews.yml"

defaults:
  run:
    working-directory: 09-crews

jobs:
  verifica:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # A faixa que o `requires-python` promete tem de ser a faixa que a CI prova.
      # Na primeira execucao real desta CI (M4b) o runner escolheu 3.12 sozinho e o
      # mypy quebrou; e o piso declarado era 3.10, versao em que o projeto nem instala
      # (onnxruntime, via crewai[tools], nao publica wheel cp310). Faixa declarada sem
      # matriz que a exercite e mais uma promessa sem mecanismo.
      matrix:
        python: ["3.11", "3.12", "3.13"]

    name: verifica (py${{ matrix.python }})

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      # `--locked` de volta. Ele saiu no commit 7ec9613 — o MESMO que dessincronizou o
      # lockfile — entao a guarda que teria pego a deriva foi removida junto com a
      # mudanca que a criou. A plataforma da CrewAI resolve pelo lockfile: lock velho
      # significa deploy com dependencias diferentes das testadas.
      - name: Sincronizar dependencias (lockfile tem de estar em dia)
        run: uv sync --extra dev --locked

      # A trava de portabilidade. core/ guarda o reconciliador, o calendario e a
      # tabela de vedacoes — o que vale dinheiro. Se ele importar crewai, uma mudanca
      # de API deles vira retrabalho no nosso ativo. Isto reprova o build.
      - name: Fronteira — core/ nao depende da CrewAI
        run: uv run python scripts/audita_fronteira.py

      - name: Lint
        run: uv run ruff check .

      # Cobre o pacote inteiro desde o M4b. Antes olhava so `core/`, e cinco relatorios
      # de marco disseram "mypy estrito" sem essa ressalva.
      # `--python-version` casa a semantica assumida com os stubs instalados neste job.
      # Sem isso o mypy le site-packages de 3.12/3.13 assumindo 3.11 e morre no stub do
      # numpy — dependencia transitiva que nenhuma linha nossa importa.
      - name: Tipos
        run: uv run mypy --python-version ${{ matrix.python }}

      - name: Testes
        run: uv run pytest -q

      # O check de prontidao para deploy vem da propria CrewAI. Ele **sai com codigo 0
      # mesmo com aviso**, entao nao gateia sozinho — o passo confere a saida.
      #
      # A primeira versao deste passo reprovou um validate que PASSOU. Ela procurava a
      # palavra "warning" na saida, e quem escreveu essa palavra foi o `uv`, avisando que
      # o `VIRTUAL_ENV` posto pelo setup-uv aponta para a raiz do repositorio enquanto o
      # projeto mora em `09-crews`. Uma guarda que tira conclusao de ruido de terceiro e a
      # mesma classe de defeito deste marco — desta vez na direcao segura, mas CI que fica
      # vermelha por motivo errado e CI que as pessoas param de ler.
      #
      # O criterio de agora saiu de LER o `crewai_cli/deploy/validate.py`, nao de adivinhar
      # o formato da saida: `render_report` imprime "Pre-deploy validation passed." **se e
      # somente se** a lista de resultados estiver vazia — zero erro E zero aviso. Havendo
      # qualquer coisa, ele imprime as linhas `ERROR`/`WARNING` e **nunca** a frase.
      #
      # Entao a frase e gate exato, e sozinha: procurar "warning" ALEM dela e redundante
      # (nao existe saida com aviso e frase) e so consegue produzir vermelho falso. Exigir
      # a PROVA de sucesso tambem cobre o comando que morre calado, que o criterio velho
      # aprovava — ausencia de erro nao e evidencia de sucesso.
      #
      # `unset VIRTUAL_ENV` mata o ruido do uv na fonte, em vez de filtra-lo por nome:
      # lista de ruido conhecido envelhece calada.
      - name: Pronto para a CrewAI (crewai deploy validate)
        if: matrix.python == '3.11'
        run: |
          unset VIRTUAL_ENV
          saida=$(uv run crewai deploy validate 2>&1)
          echo "$saida"
          if ! echo "$saida" | grep -qF "Pre-deploy validation passed."; then
            echo "::error::crewai deploy validate nao confirmou a validacao (erro, aviso, ou nenhuma saida) — o projeto nao esta pronto para subir"
            exit 1
          fi

      # Dado fiscal de cliente e o dado mais sensivel que a ABBA toca.
      # Certificado digital commitado e incidente, nao bug.
      - name: Nenhum segredo commitado
        if: matrix.python == '3.11'
        working-directory: .
        run: |
          if git ls-files | grep -Ei '\.(p12|pfx|pem|key)$'; then
            echo "::error::certificado ou chave privada commitada — remova e rotacione"
            exit 1
          fi
          if git ls-files | grep -Ex '(.*/)?\.env'; then
            echo "::error::.env commitado"
            exit 1
          fi
          echo "nenhum segredo rastreado"

      # O dossie carrega dado fiscal de cliente e nunca pode entrar no repositorio.
      # `core/arquivo.py` ja recusa gravar dentro de arvore git; isto e o cinto.
      - name: Nenhum dossie commitado
        if: matrix.python == '3.11'
        working-directory: .
        run: |
          if git ls-files | grep -E '\.(md\.enc|meta\.json)$'; then
            echo "::error::dossie de cliente rastreado no repositorio"
            exit 1
          fi
          echo "nenhum dossie rastreado"
