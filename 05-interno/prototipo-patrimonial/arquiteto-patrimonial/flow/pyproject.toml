[project]
name = "patrimonio-flow"
version = "0.1.0"
description = "Prototipo ABBA — apoio a planejamento patrimonial internacional (ferramenta do advogado; conformidade-primeiro)"
requires-python = ">=3.11"
dependencies = [
    "crewai>=1.15.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
