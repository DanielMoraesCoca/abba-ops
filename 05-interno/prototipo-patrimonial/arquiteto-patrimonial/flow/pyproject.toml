[project]
name = "patrimonio-flow"
version = "0.1.0"
description = "Prototipo ABBA — apoio a planejamento patrimonial internacional (ferramenta do advogado; conformidade-primeiro)"
requires-python = ">=3.11"
dependencies = [
    "crewai>=1.15.0",
    "pydantic>=2.7",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest"]

# Entrypoints que o CrewAI AMP espera de um projeto Flow (detecção + run).
[project.scripts]
kickoff = "patrimonio_flow.main:kickoff"
run_crew = "patrimonio_flow.main:kickoff"
plot = "patrimonio_flow.main:plot"

# Marca o projeto como Flow para a validação de deploy do AMP
# (sem isto o detector procura o layout de Crew — src/<pkg>/crew.py + config/).
[tool.crewai]
type = "flow"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
