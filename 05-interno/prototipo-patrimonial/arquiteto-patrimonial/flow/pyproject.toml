[project]
name = "patrimonio-flow"
version = "0.1.0"
description = "Prototipo ABBA — apoio a planejamento patrimonial internacional (ferramenta do advogado; conformidade-primeiro)"
requires-python = ">=3.11"
dependencies = [
    "crewai[anthropic]>=1.15.0",   # provider nativo Anthropic (Claude) — a conexão do AMP é Anthropic
    "pydantic>=2.7",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest"]

# Entrypoints que o CrewAI AMP espera de um projeto Flow (detecção + run).
[project.scripts]
kickoff = "patrimonio_flow.main:kickoff"
run_crew = "patrimonio_flow.main:kickoff"
plot = "patrimonio_flow.main:plot"

# Marca o projeto como Flow para a validação de deploy do AMP
# (sem isto o detector procura o layout de Crew — src/<pkg>/crew.py + config/).
[tool.crewai]
type = "flow"

[tool.setuptools.packages.find]
where = ["src"]

# CRÍTICO: os YAML de configuração das crews precisam ir no pacote instalado —
# senão CrewBase não acha config/*.yaml em runtime no AMP (só falha num caso
# liberado, que carrega as crews). O caso bloqueado nunca exercita isto.
[tool.setuptools.package-data]
patrimonio_flow = ["crews/config/*.yaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
