<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ABBA — Estudos de wordmark</title>
<style>
  @font-face { font-family: 'Cormorant'; src: url('fonts/CormorantGaramond.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'EBGaramond'; src: url('fonts/EBGaramond.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'Playfair'; src: url('fonts/PlayfairDisplay.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'Cinzel'; src: url('fonts/Cinzel.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'Marcellus'; src: url('fonts/Marcellus.ttf'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #333; }
  .frame { width: 1400px; height: 500px; margin: 24px auto; position: relative;
           display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .claro { background: #FFFFFF; }
  .escuro { background: #1B2A4A; }

  .tagline { font-family: 'EBGaramond', serif; letter-spacing: 0.55em; text-indent: 0.55em;
             font-size: 26px; margin-top: 26px; }
  .claro .tagline { color: #5A6472; }
  .escuro .tagline { color: #C2A35B; }

  /* E1 — Cormorant + ponto-fonte sobre o eixo */
  .e1 .mark { font-family: 'Cormorant', serif; font-weight: 600; font-size: 220px;
              letter-spacing: 0.14em; text-indent: 0.14em; line-height: 1; }
  .claro .mark { color: #1B2A4A; }
  .escuro .mark { color: #FFFFFF; }
  .e1 .dot { width: 26px; height: 26px; border-radius: 50%; background: #C2A35B; margin-bottom: 18px; }

  /* E2 — EB Garamond + eixo do palíndromo (filete vertical central) */
  .e2 .row { position: relative; display: flex; align-items: baseline; }
  .e2 .mark { font-family: 'EBGaramond', serif; font-weight: 600; font-size: 220px;
              letter-spacing: 0.12em; line-height: 1; }
  .e2 .axis { width: 3px; height: 150px; background: #C2A35B; margin: 0 44px; align-self: center; }
  .e2 .half { display: inline-block; }

  /* E3 — Cinzel monumental (Trajan) */
  .e3 .mark { font-family: 'Cinzel', serif; font-weight: 600; font-size: 190px;
              letter-spacing: 0.16em; text-indent: 0.16em; line-height: 1; }
  .e3 .filete { width: 340px; height: 3px; background: #C2A35B; margin-top: 30px; }

  /* E4 — Marcellus + arco da nascente sob o nome */
  .e4 .mark { font-family: 'Marcellus', serif; font-size: 205px;
              letter-spacing: 0.12em; text-indent: 0.12em; line-height: 1; }
  .e4 svg { margin-top: 8px; }

  /* E5 — Playfair com BB em dourado (o coração do palíndromo) */
  .e5 .mark { font-family: 'Playfair', serif; font-weight: 600; font-size: 210px;
              letter-spacing: 0.1em; text-indent: 0.1em; line-height: 1; }
  .e5 .mark b { font-weight: 600; color: #C2A35B; }
</style>
</head>
<body>

<!-- E1 · claro e escuro -->
<div class="frame claro e1" id="e1-claro">
  <div class="dot"></div>
  <div class="mark">ABBA</div>
  <div class="tagline">CONSULTORIA DE IA</div>
</div>
<div class="frame escuro e1" id="e1-escuro">
  <div class="dot"></div>
  <div class="mark">ABBA</div>
  <div class="tagline">CONSULTORIA DE IA</div>
</div>

<!-- E2 · eixo central -->
<div class="frame claro e2" id="e2-claro">
  <div class="row">
    <span class="mark" style="color:#1B2A4A">AB</span>
    <span class="axis"></span>
    <span class="mark" style="color:#1B2A4A">BA</span>
  </div>
  <div class="tagline">CONSULTORIA DE IA</div>
</div>

<!-- E3 · Cinzel monumental -->
<div class="frame claro e3" id="e3-claro">
  <div class="mark" style="color:#1B2A4A">ABBA</div>
  <div class="filete"></div>
  <div class="tagline">CONSULTORIA DE IA</div>
</div>
<div class="frame escuro e3" id="e3-escuro">
  <div class="mark" style="color:#FFFFFF">ABBA</div>
  <div class="filete"></div>
  <div class="tagline">CONSULTORIA DE IA</div>
</div>

<!-- E4 · arco da nascente -->
<div class="frame claro e4" id="e4-claro">
  <div class="mark" style="color:#1B2A4A">ABBA</div>
  <svg width="560" height="60" viewBox="0 0 560 60">
    <path d="M 20 14 Q 280 74 540 14" fill="none" stroke="#C2A35B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="280" cy="46" r="9" fill="#C2A35B"/>
  </svg>
  <div class="tagline" style="margin-top:10px">CONSULTORIA DE IA</div>
</div>

<!-- E5 · BB dourado -->
<div class="frame claro e5" id="e5-claro">
  <div class="mark" style="color:#1B2A4A">A<b>BB</b>A</div>
  <div class="tagline">CONSULTORIA DE IA</div>
</div>

</body>
</html>
