    .rule { width: 132px; height: 2px; background: #C2A35B; margin: 54px 0 44px; flex: none; }

    }
    .src {
      font-size: 22px; line-height: 1.5; color: #7F8BA3; margin: 0;
      letter-spacing: .01em; max-width: 620px;
    }
    .swipe {
      font-size: 21px; letter-spacing: .26em; text-transform: uppercase;
      color: #C2A35B; white-space: nowrap; display: flex; align-items: center; gap: 14px;

    .pip {
      position: absolute; top: 118px; left: 112px;
      font-size: 21px; letter-spacing: .2em; color: #4E5C78;
