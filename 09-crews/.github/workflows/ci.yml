name: CI

# Esta CI so entra em vigor quando o projeto virar o repositorio `abba-crews`.
# Enquanto ele estiver em staging dentro de abba-ops, o GitHub nao le workflows
# fora da raiz do repo — rode `make verifica` (ou os comandos abaixo) na mao.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sincronizar dependencias
        run: uv sync --extra dev --locked

      # A trava de portabilidade. core/ guarda o reconciliador e a tabela de
      # vedacoes — o que vale dinheiro. Se ele importar crewai, uma mudanca de
      # API deles vira retrabalho no nosso ativo. Isto reprova o build.
      - name: Fronteira — core/ nao depende da CrewAI
        run: uv run python scripts/audita_fronteira.py

      - name: Lint
        run: uv run ruff check .

      - name: Tipos (estrito em core/)
        run: uv run mypy

      - name: Testes
        run: uv run pytest -q

      # Dado fiscal de cliente e o dado mais sensivel que a ABBA toca.
      # Certificado digital commitado e incidente, nao bug.
      - name: Nenhum segredo commitado
        run: |
          if git ls-files | grep -Ei '\.(p12|pfx|pem|key)$'; then
            echo "::error::certificado ou chave privada commitada — remova e rotacione"
            exit 1
          fi
          if git ls-files | grep -Fx '.env'; then
            echo "::error::.env commitado"
            exit 1
          fi
          echo "nenhum segredo rastreado"
