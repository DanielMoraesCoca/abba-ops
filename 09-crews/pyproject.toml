[project]
name = "abba-crews"
version = "0.1.0"
description = "Camada de Caixa da reforma tributaria — biblioteca de crews da ABBA para a apuracao assistida de IBS/CBS"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.18,<2.0.0",
    # Cifra dos dossies em repouso (core/cofre.py). Chega transitivamente pela crewai,
    # mas depender disso seria depender de detalhe de outro pacote numa trava de
    # privacidade — entao e declarada aqui.
    "cryptography>=43",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
    "typer>=0.15",
]

[project.scripts]
# Convencao da CrewAI — nao renomear: o AMP procura estes nomes.
kickoff = "abba_crews.main:kickoff"
run_crew = "abba_crews.main:kickoff"
plot = "abba_crews.main:plot"
run_with_trigger = "abba_crews.main:run_with_trigger"
# CLI de operacao da ABBA.
abba-crews = "abba_crews.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abba_crews"]

[tool.crewai]
type = "flow"

[tool.ruff]
line-length = 100
# Tem de casar com requires-python (>=3.10). Com "py311" o ruff propunha idiomas que
# quebram em 3.10 — reescreveu `timezone.utc` para `datetime.UTC`, que so existe em
# 3.11+. Lint que mira mais alto que o pacote suporta nao avisa: ele introduz o bug.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
# Ate 2026-09-02 isto era `files = ["src/abba_crews/core"]`, e cinco relatorios de marco
# disseram "mypy estrito" sem a ressalva de que a CLI inteira (9 comandos), o `main.py`
# e os `flows/` ficavam de fora. Agora cobre o pacote.
files = ["src/abba_crews"]

[[tool.mypy.overrides]]
# A CrewAI nao publica tipos completos; `flows/` herda dela. O `core/`, que e o ativo,
# segue estrito de verdade.
module = ["crewai.*", "crewai_tools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "types-pyyaml>=6.0.12.20260815",
]
