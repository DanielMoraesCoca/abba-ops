# Configuracao de cliente — o "ajuste" sobre o esqueleto pronto.
#
# Copie para <cnpj>.yaml (so digitos) e preencha. O nome do arquivo tem de bater
# com o CNPJ do conteudo: conferir a apuracao do CNPJ errado e o pior erro
# possivel deste produto, e o carregador reprova a divergencia.
#
# NENHUM SEGREDO AQUI. Certificado digital e credencial da Plataforma RTC vivem
# em gerenciador de segredos e chegam por variavel de ambiente (.env.example).

cnpj: "00000000000191"
razao_social: "Empresa Exemplo Ltda"

# regular | simples — o Simples tem cronograma proprio a partir de 01/01/2027.
regime: regular

# true = a proposta fica disponivel ate o dia 20; false = ate o dia 15.
# O PRAZO de manifestacao e o ultimo dia util do mes seguinte nos dois casos.
entrega_dere: false

# Liga ao cerebro do assessment-brain. Opcional ate o M5 (outbox do ledger).
engagement_id: null

# Diferenca ignorada por arredondamento entre sistemas.
# Tolerancia alta esconde divergencia real — o padrao e zero.
tolerancia_brl: "0.00"

# Quem confere e assina. Sem nome nao ha gate humano, so automacao.
aprovacao:
  responsavel_nome: "Nome do Contador"
  responsavel_email: "contador@escritorio.com.br"
  papel: contador

produtos_ativos:
  - sentinela
